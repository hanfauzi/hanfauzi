# Builds three SVG cards into this repo every day:
#   github-metrics.svg        overview, contribution calendar with streaks, top languages
#   metrics-achievements.svg  ranked achievements (the "trophies")
#   metrics-habits.svg        when and how you usually code
# Needs a repository secret METRICS_TOKEN: a classic personal access token with the "read:user" and "repo" scopes.
name: Metrics

on:
  schedule:
    - cron: "0 17 * * *" # every day at 00:00 WIB
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Overview
        uses: lowlighter/metrics@latest
        continue-on-error: true
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: hanfauzi
          filename: github-metrics.svg
          template: classic
          base: header, activity
          config_timezone: Asia/Jakarta
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage

      - name: Achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: hanfauzi
          filename: metrics-achievements.svg
          base: ""
          config_timezone: Asia/Jakarta
          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_limit: 8

      - name: Habits
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: hanfauzi
          filename: metrics-habits.svg
          base: ""
          config_timezone: Asia/Jakarta
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_from: 200
          plugin_habits_days: 30
